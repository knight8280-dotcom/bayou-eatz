<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200" role="img" aria-label="Bayou Eatz — Taste the Bayou">
  <title>Bayou Eatz — Taste the Bayou</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8dc94"/>
      <stop offset=".45" stop-color="#e8b53c"/>
      <stop offset="1" stop-color="#b8861f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2183"/>
      <stop offset="1" stop-color="#3a1055"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="8" y="26" width="444" height="150" rx="26" fill="url(#plate)" stroke="#e8b53c" stroke-width="4"/>
  <rect x="20" y="38" width="420" height="126" rx="18" fill="none" stroke="#7c3aad" stroke-width="2"/>

  <!-- BAYOU -->
  <text x="46" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold"
        letter-spacing="3" fill="url(#gold)" stroke="#2a0f3d" stroke-width="1.5" paint-order="stroke">BAYOU</text>
  <g fill="#e8b53c">
    <circle cx="196" cy="70" r="3"/><circle cx="209" cy="70" r="3"/><circle cx="222" cy="70" r="3"/>
    <circle cx="235" cy="70" r="3"/><circle cx="248" cy="70" r="3"/>
  </g>

  <!-- EATZ -->
  <text x="40" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold"
        letter-spacing="2" fill="url(#gold)" stroke="#2a0f3d" stroke-width="2" paint-order="stroke">EATZ</text>

  <!-- ribbon -->
  <path d="M46 146h214l-10 24H56z" fill="#2f6b3a" stroke="#1d4526" stroke-width="2"/>
  <text x="66" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold"
        letter-spacing="2.5" fill="#f4e8cd">TASTE THE BAYOU</text>

  <!-- gumbo bowl -->
  <g transform="translate(300 76)">
    <path d="M4 26c0 18 14 30 32 30s32-12 32-30z" fill="#5b2183" stroke="#e8b53c" stroke-width="3"/>
    <ellipse cx="36" cy="26" rx="34" ry="8" fill="#7a2f18" stroke="#e8b53c" stroke-width="3"/>
    <circle cx="24" cy="25" r="4" fill="#e8b53c"/><circle cx="38" cy="27" r="4" fill="#e8b53c"/><circle cx="50" cy="24" r="4" fill="#e8b53c"/>
    <path d="M26 12c-6-6 4-10-2-16M40 10c-6-6 4-10-2-16" fill="none" stroke="#f4e8cd" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- fleur-de-lis -->
  <g transform="translate(392 66) scale(1.9)" fill="#e8b53c">
    <path d="M12 1c1.9 2.6 2.5 5 1.6 7.3-.5 1.3-.9 2-.9 3.2h2.1c.6-2.3 2.3-3.6 4.3-3.3 2.1.3 3.3 2 3 4-.3 2.2-2.3 3.6-4.8 3.3-.9-.1-1.7-.4-2.5-.9.6 1.6 1.9 2.6 3.6 3l-.5 1.6c-1.7-.3-3-1-3.9-2.1V21h1.8v1.6h-1.8V24h-1.8v-1.4H10V21h1.2v-3.9c-.9 1.1-2.2 1.8-3.9 2.1l-.5-1.6c1.7-.4 3-1.4 3.6-3-.8.5-1.6.8-2.5.9-2.5.3-4.5-1.1-4.8-3.3-.3-2 .9-3.7 3-4 2-.3 3.7 1 4.3 3.3h2.1c0-1.2-.4-1.9-.9-3.2C9.5 6 10.1 3.6 12 1z"/>
  </g>

  <!-- bead strand -->
  <g>
    <circle cx="56" cy="180" r="5" fill="#e8b53c"/><circle cx="76" cy="182" r="5" fill="#7c3aad"/>
    <circle cx="96" cy="180" r="5" fill="#4b8f56"/><circle cx="116" cy="182" r="5" fill="#e8b53c"/>
    <circle cx="136" cy="180" r="5" fill="#7c3aad"/><circle cx="156" cy="182" r="5" fill="#4b8f56"/>
    <circle cx="176" cy="180" r="5" fill="#e8b53c"/><circle cx="196" cy="182" r="5" fill="#7c3aad"/>
  </g>
</svg>
